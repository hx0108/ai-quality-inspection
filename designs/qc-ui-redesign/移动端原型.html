<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 品质检查系统 · 移动端原型（重设计 v2）</title>
<link rel="stylesheet" href="qc-theme.css">
<style>
  html.no-anim *, html.no-anim *::before, html.no-anim *::after { animation: none !important; transition: none !important; }

  .stage { display: flex; height: 100vh; background: var(--bg); }
  .m-rail {
    width: 216px; flex-shrink: 0; border-right: 1px solid var(--ink-200);
    background: var(--bg-card); padding: 18px 12px; overflow-y: auto;
  }
  .m-rail h1 { font-size: 14px; font-weight: 800; color: var(--ink-900); padding: 0 8px 4px; }
  .m-rail .sub { font-size: 11.5px; color: var(--ink-400); padding: 0 8px 12px; border-bottom: 1px solid var(--ink-100); margin-bottom: 10px; }
  .m-nav-item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 10px; border-radius: var(--r); border: none; background: transparent;
    font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--ink-600);
    cursor: pointer; text-align: left; transition: background 0.12s, color 0.12s; margin-bottom: 2px;
  }
  .m-nav-item:hover { background: var(--bg-hover); color: var(--ink-900); }
  .m-nav-item.on { background: var(--brand-soft); color: var(--brand-ink); font-weight: 600; }
  .m-nav-item .idx { font-size: 10.5px; font-family: var(--mono); color: var(--ink-400); width: 18px; }
  .m-nav-item.on .idx { color: var(--brand-ink); }
  .m-nav-item .tag { margin-left: auto; font-size: 10px; color: var(--ink-400); }

  .m-center { flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 24px; }

  /* ===== 手机框 ===== */
  .phone {
    width: 390px; height: 800px; flex-shrink: 0;
    background: var(--bg);
    border: 10px solid #16161c;
    border-radius: 44px;
    box-shadow: var(--shadow-overlay);
    overflow: hidden;
    display: flex; flex-direction: column;
    position: relative;
  }
  .m-status {
    height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px; font-size: 12.5px; font-weight: 600; color: var(--ink-900);
    background: var(--bg-card);
  }
  .m-status .sig { display: flex; gap: 5px; align-items: center; }
  .m-status svg { width: 15px; height: 12px; stroke: var(--ink-900); fill: none; stroke-width: 1.6; }

  .m-body { flex: 1; overflow-y: auto; background: var(--bg); }
  .m-body::-webkit-scrollbar { width: 0; }

  .m-tabbar {
    height: 58px; flex-shrink: 0; background: var(--bg-card);
    border-top: 1px solid var(--ink-200);
    display: flex; padding-bottom: 6px;
  }
  .m-tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    border: none; background: transparent; cursor: pointer;
    font-family: var(--sans); font-size: 10.5px; font-weight: 500; color: var(--ink-400);
  }
  .m-tab svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  .m-tab.on { color: var(--brand); font-weight: 600; }

  /* ===== 移动端通用组件 ===== */
  .m-nav {
    height: 48px; flex-shrink: 0; background: var(--bg-card);
    border-bottom: 1px solid var(--ink-100);
    display: flex; align-items: center; padding: 0 8px; gap: 4px;
  }
  .m-nav .back { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; color: var(--ink-700); cursor: pointer; border-radius: var(--r-sm); }
  .m-nav .back:hover { background: var(--bg-hover); }
  .m-nav .back svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .m-nav .m-title { flex: 1; text-align: center; font-size: 15.5px; font-weight: 700; color: var(--ink-900); }
  .m-nav .r-act { width: 34px; }

  .m-pad { padding: 14px; }

  .m-card { background: var(--bg-card); border: 1px solid var(--ink-200); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
  .m-card-h { padding: 12px 14px 0; display: flex; align-items: center; justify-content: space-between; }
  .m-card-t { font-size: 14px; font-weight: 700; color: var(--ink-900); }

  .m-cell { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--ink-100); }
  .m-cell:last-child { border-bottom: none; }
  .m-cell .gr { flex: 1; min-width: 0; }
  .m-cell .t { font-size: 14px; font-weight: 600; color: var(--ink-900); }
  .m-cell .d { font-size: 12px; color: var(--ink-500); margin-top: 2px; }

  .m-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 42px; padding: 0 18px; border-radius: var(--r);
    border: 1px solid var(--ink-200); background: var(--bg-card);
    font-family: var(--sans); font-size: 14.5px; font-weight: 600; color: var(--ink-800);
    cursor: pointer; transition: all 0.12s;
  }
  .m-btn:active { transform: scale(0.98); }
  .m-btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .m-btn-block { width: 100%; }

  .m-ipt {
    width: 100%; height: 44px; padding: 0 13px;
    border: 1px solid var(--ink-200); border-radius: var(--r);
    background: var(--bg-card); font-family: var(--sans); font-size: 14.5px; color: var(--ink-900);
    outline: none;
  }
  .m-ipt:focus { border-color: var(--brand); box-shadow: var(--focus-ring); }

  .m-kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .m-kpi { background: var(--bg-card); border: 1px solid var(--ink-200); border-radius: 12px; padding: 13px 14px 11px; }
  .m-kpi .l { font-size: 11.5px; font-weight: 600; color: var(--ink-500); }
  .m-kpi .v { font-size: 24px; font-weight: 700; color: var(--ink-900); margin-top: 3px; font-variant-numeric: tabular-nums; letter-spacing: -0.5px; }
  .m-kpi .v small { font-size: 12px; font-weight: 600; color: var(--ink-400); }

  .m-track { height: 7px; border-radius: 4px; background: var(--chart-bar-track); overflow: hidden; }
  .m-fill { display: block; height: 100%; border-radius: 4px; background: var(--chart-1); }

  .m-check-row { display: flex; gap: 8px; }
  .m-check-btn {
    flex: 1; height: 44px; border-radius: var(--r);
    border: 1px solid var(--ink-200); background: var(--bg-card);
    font-family: var(--sans); font-size: 14.5px; font-weight: 600; color: var(--ink-600);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: all 0.12s;
  }
  .m-check-btn.pass.on { background: var(--ok-soft); border-color: var(--ok-border); color: var(--ok-strong); }
  .m-check-btn.fail.on { background: var(--err-soft); border-color: var(--err-border); color: var(--err-strong); }
  .m-check-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; flex-shrink: 0; }

  .m-upload {
    height: 86px; border: 1.5px dashed var(--ink-300); border-radius: var(--r);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    color: var(--ink-400); font-size: 12px; cursor: pointer; background: var(--bg-card);
  }
  .m-upload svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; }

  .m-note {
    padding: 9px 12px; border-radius: var(--r); font-size: 12px; line-height: 1.6;
    background: var(--brand-soft); color: var(--brand-ink);
    display: flex; gap: 7px; align-items: flex-start;
  }
  .m-note svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; flex-shrink: 0; margin-top: 2px; }

  .proto-note { position: fixed; left: 12px; bottom: 12px; z-index: 90; font-size: 11px; color: var(--ink-500); background: var(--bg-card); border: 1px solid var(--ink-200); border-radius: 999px; padding: 4px 10px; box-shadow: var(--shadow-pop); user-select: none; }
</style>
</head>
<body>
<div id="root"></div>
<div class="proto-note">移动端原型 · 数据为演示用假数据</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="pc-icons.jsx"></script>
<script type="text/babel" src="pc-data.jsx"></script>
<script type="text/babel" src="m-pages-1.jsx"></script>
<script type="text/babel" src="m-pages-2.jsx"></script>
<script type="text/babel" src="m-pages-3.jsx"></script>
<script type="text/babel" src="m-shell.jsx"></script>
</body>
</html>
