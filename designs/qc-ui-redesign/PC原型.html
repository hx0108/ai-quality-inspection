<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 品质检查系统 · PC 原型（重设计 v2）</title>
<link rel="stylesheet" href="qc-theme.css">
<style>
  /* ===== 应用外壳（落地时映射进 PcLayout.vue） ===== */
  .shell { display: flex; height: 100vh; overflow: hidden; }

  .side {
    width: 216px;
    flex-shrink: 0;
    background: var(--side-bg);
    border-right: 1px solid var(--side-border);
    display: flex;
    flex-direction: column;
  }
  .side-brand {
    height: 52px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 16px;
    flex-shrink: 0;
  }
  .side-logo {
    width: 26px; height: 26px;
    border-radius: 7px;
    background: linear-gradient(135deg, #2bb8aa 0%, #0c7168 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14);
    flex-shrink: 0;
  }
  .side-logo svg { width: 15px; height: 15px; stroke: #fff; fill: none; stroke-width: 2; }
  .side-name { font-size: 13px; font-weight: 700; color: var(--side-text-strong); letter-spacing: 0.2px; }

  .side-nav { flex: 1; overflow-y: auto; padding: 10px 10px 16px; }
  .side-nav::-webkit-scrollbar { width: 5px; }
  .side-nav::-webkit-scrollbar-thumb { background: #2c2c36; }

  .sn-label {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.8px;
    color: #5d5d6a;
    padding: 14px 10px 5px;
  }
  .sn-item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 9px;
    height: 32px;
    padding: 0 10px;
    border-radius: var(--r);
    font-size: 13px;
    font-weight: 500;
    color: var(--side-text);
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
    margin-bottom: 1px;
  }
  .sn-item:hover { background: var(--side-hover); color: var(--side-text-strong); }
  .sn-item.on { background: var(--side-active-bg); color: #c8ece7; font-weight: 600; }
  .sn-item.on::before {
    content: "";
    position: absolute;
    left: -10px;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 16px;
    border-radius: 0 2px 2px 0;
    background: var(--side-active-line);
  }
  .sn-item svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.7; opacity: 0.75; flex-shrink: 0; }
  .sn-item.on svg { opacity: 1; }
  .sn-badge { margin-left: auto; font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 0 5px; height: 15px; line-height: 15px; border-radius: 8px; background: var(--err); color: #fff; }

  .side-foot { padding: 10px; border-top: 1px solid var(--side-border); }
  .side-user {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: var(--r);
    cursor: pointer; transition: background 0.12s;
  }
  .side-user:hover { background: var(--side-hover); }
  .avatar {
    width: 24px; height: 24px; border-radius: 50%;
    background: #33333f;
    color: #c9cdf2;
    font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .side-user span { font-size: 12px; color: var(--side-text-strong); font-weight: 500; }

  /* ===== 主区 ===== */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

  .top {
    height: 52px;
    flex-shrink: 0;
    background: var(--bg-card);
    border-bottom: 1px solid var(--ink-200);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
  }
  .top-title { font-size: 14px; font-weight: 600; color: var(--ink-900); }
  .top-crumb { font-size: 12px; color: var(--ink-400); margin-right: 8px; }
  .top-right { display: flex; align-items: center; gap: 8px; }

  .proj-chip {
    display: inline-flex; align-items: center; gap: 6px;
    height: 30px; padding: 0 10px;
    border: 1px solid var(--ink-200); border-radius: var(--r);
    background: var(--bg-card);
    font-size: 12.5px; font-weight: 600; color: var(--ink-800);
    cursor: pointer; transition: border-color 0.12s, background 0.12s;
  }
  .proj-chip:hover { border-color: var(--ink-300); background: var(--bg-hover); }
  .proj-chip svg { width: 11px; height: 11px; stroke: var(--ink-500); fill: none; stroke-width: 2; }

  .icon-btn {
    width: 30px; height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid transparent; border-radius: var(--r);
    background: transparent; color: var(--ink-600); cursor: pointer;
    transition: background 0.12s, color 0.12s;
    position: relative;
  }
  .icon-btn:hover { background: var(--bg-hover); color: var(--ink-900); }
  .icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; }
  .icon-btn .bubble {
    position: absolute; top: 3px; right: 3px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--err); border: 1.5px solid var(--bg-card);
  }

  .user-chip {
    display: flex; align-items: center; gap: 7px;
    height: 30px; padding: 0 8px 0 4px;
    border-radius: 999px; cursor: pointer;
    transition: background 0.12s;
  }
  .user-chip:hover { background: var(--bg-hover); }
  .user-chip .avatar { background: var(--brand-soft); color: var(--brand-ink); }
  .user-chip b { font-size: 12.5px; color: var(--ink-800); font-weight: 600; }

  .cnt {
    flex: 1;
    overflow-y: auto;
    padding: 22px 24px 32px;
  }
  .page { max-width: 1280px; margin: 0 auto; animation: pgIn 0.25s var(--ease); }

  /* 概览页双栏 */
  .charts2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap-blk, 14px); margin-top: var(--gap-blk, 14px); }
  @media (max-width: 1000px) { .charts2 { grid-template-columns: 1fr; } }

  /* 模块得分热力表 */
  .module-tbl td.heat { padding: 4px 5px; }

  /* 截图模式：URL 加 #shot 时禁用动画，保证全页截图不被入场动画截断 */
  html.no-anim *, html.no-anim *::before, html.no-anim *::after {
    animation: none !important;
    transition: none !important;
  }
  /* 截图模式下放开内部滚动容器，让全页截图能覆盖全部内容 */
  html.no-anim .shell { height: auto; min-height: 100vh; }
  html.no-anim .cnt { overflow: visible; }

  /* ===== 原型辅助（不落地） ===== */
  .proto-note {
    position: fixed; left: 12px; bottom: 12px; z-index: 90;
    font-size: 11px; color: var(--ink-500);
    background: var(--bg-card); border: 1px solid var(--ink-200);
    border-radius: 999px; padding: 4px 10px;
    box-shadow: var(--shadow-pop);
    user-select: none;
  }

  /* Tweaks 面板 */
  .tweaks {
    position: fixed; right: 14px; bottom: 14px; z-index: 90;
    width: 218px;
    background: var(--bg-card);
    border: 1px solid var(--ink-200);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-overlay);
    padding: 12px 14px 13px;
    font-size: 12px;
  }
  .tweaks h4 { font-size: 12px; font-weight: 700; color: var(--ink-900); display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; }
  .tweaks h4 button { border: none; background: none; font-size: 11px; color: var(--ink-500); cursor: pointer; font-family: var(--sans); }
  .tweaks label { display: block; color: var(--ink-600); margin: 7px 0 3px; font-weight: 500; }
  .tweaks input[type="range"] { width: 100%; accent-color: var(--brand); }
  .tweaks .swatches { display: flex; gap: 6px; margin-top: 2px; }
  .tweaks .sw { width: 22px; height: 22px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; }
  .tweaks .sw.on { border-color: var(--ink-900); }
  .tweaks-open {
    position: fixed; right: 14px; bottom: 14px; z-index: 90;
    height: 32px; padding: 0 12px; border-radius: 999px;
    border: 1px solid var(--ink-200); background: var(--bg-card);
    font-size: 12px; font-weight: 600; color: var(--ink-700); cursor: pointer;
    box-shadow: var(--shadow-pop); font-family: var(--sans);
  }
</style>
</head>
<body>
<div id="root"></div>
<div class="proto-note">重设计原型 v2 · 数据为演示用假数据</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="pc-icons.jsx"></script>
<script type="text/babel" src="pc-data.jsx"></script>
<script type="text/babel" src="pc-page-dashboard.jsx"></script>
<script type="text/babel" src="pc-pages-quality.jsx"></script>
<script type="text/babel" src="pc-pages-data.jsx"></script>
<script type="text/babel" src="pc-pages-ops.jsx"></script>
<script type="text/babel" src="pc-shell.jsx"></script>
</body>
</html>
